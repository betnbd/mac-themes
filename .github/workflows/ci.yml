name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify vendored assets
        run: python3 scripts/verify-assets.py
      - name: Test
        run: zsh scripts/test.sh
      - name: Build test package
        env:
          MAC_THEMES_SIGNING: adhoc
        run: zsh scripts/build.sh
      - name: Verify package
        run: python3 scripts/verify-package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mac-Themes-test-build
          path: dist/Mac Themes.zip
          retention-days: 7
